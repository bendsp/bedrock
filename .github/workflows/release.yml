name: Release

on:
  push:
    tags:
      - "*"
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      sha: ${{ steps.release.outputs.sha }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare stable or nightly release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

  checks:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, checks]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    environment: Build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set version for this build only
        run: node scripts/release-version.mjs
      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'darwin'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Write notarization key
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: python3 scripts/write-notarization-key.py
      - name: Build macOS app and installers
        if: matrix.platform == 'darwin'
        run: pnpm exec electron-forge make --platform=darwin --arch=${{ matrix.arch }}
        env:
          BEDROCK_RELEASE: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Verify macOS signature and stapled tickets
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          APP="out/Bedrock-darwin-${{ matrix.arch }}/Bedrock.app"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"
          while IFS= read -r -d '' dmg; do
            xcrun stapler validate "$dmg"
          done < <(find out/make -name '*.dmg' -print0)
      - name: Build Windows installer
        if: matrix.platform == 'win32'
        shell: bash
        run: pnpm make:win
        env:
          BEDROCK_RELEASE: "1"
      - name: Collect artifacts with unique names
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/verify-release-version.mjs
          node scripts/release-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          path: release-artifacts/*
          if-no-files-found: error
      - name: Verify installed upgrade and downgrade
        if: matrix.arch == 'arm64' || matrix.platform == 'win32'
        run: node scripts/update-smoke.mjs
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BEDROCK_RELEASE: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Upload installed update evidence
        if: always() && (matrix.arch == 'arm64' || matrix.platform == 'win32')
        uses: actions/upload-artifact@v4
        with:
          name: update-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          path: update-smoke-results/*
          if-no-files-found: ignore
      - name: Remove notarization key
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  draft:
    needs: [prepare, build]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Upload complete build to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            node -e 'if (!require("./release.json").isDraft) throw new Error("Refusing to change a published release")'
          else
            PRERELEASE=()
            if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --generate-notes "${PRERELEASE[@]}"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          if [[ "$RELEASE_CHANNEL" == nightly ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --title "Bedrock Nightly $RELEASE_TAG"
          fi
